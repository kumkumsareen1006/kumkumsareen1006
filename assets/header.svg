<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="t d">
<title id="t">Kumkum Sareen</title>
<desc id="d">Data engineer. A pipeline diagram: postgres and csv/api sources flow into extract, then s3 parquet, snowflake, and dbt with 32 tests. Source and warehouse row counts both read 19,238, with 0 duplicates on rerun.</desc>
<style>@font-face{font-family:'Display';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'Body';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'Mono';src:url(data:font/woff;base64,) format('woff');}
